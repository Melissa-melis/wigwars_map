  <title>WigWars Dynamic Map — Moved</title>
  <style>
    :root {
      --parchment: #f3e6c9;
      --gold: #c9a227;
      --sea: #0d1b24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: radial-gradient(ellipse at 50% 0%, #2a1c14 0%, var(--sea) 55%, #06090c 100%);
      color: var(--parchment);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }
    .card {
      width: min(560px, 100%);
      text-align: center;
    }
    .portrait-wrap {
      display: inline-block;
      padding: 10px;
      background: linear-gradient(160deg, #d4b056, #7a5a18 45%, #3d2e0e);
      border-radius: 8px;
      box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.35), 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .portrait-wrap img {
      display: block;
      width: min(210px, 82vw);
      height: auto;
      aspect-ratio: 720 / 1070;
      object-fit: cover;
      object-position: center top;
      border-radius: 3px;
      background: #2b2118;
    }
    h1 {
      margin-top: 1.6rem;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.5;
      color: var(--parchment);
    }
    a {
      display: inline-block;
      margin-top: 0.4rem;
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(201, 162, 39, 0.45);
      word-break: break-all;
      font-size: 0.92em;
    }
    a:hover {
      color: #f0d36a;
      border-bottom-color: #f0d36a;
    }
    .hint {
      margin-top: 0.85rem;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(243, 230, 201, 0.45);
    }
  </style>
